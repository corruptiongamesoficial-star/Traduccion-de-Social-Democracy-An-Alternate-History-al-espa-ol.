name: Extract translation archive (temporary)

on:
  push:
    paths:
      - ".github/workflows/extract-jsons.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
      - name: Extract archive
        run: |
          mkdir -p extracted
          7z x -y -oextracted JSONS.7z
          find extracted -type f -maxdepth 3 -print
          test -n "$(find extracted -type f -name '*.json' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: extracted-json-files
          path: extracted/**/*.json
          if-no-files-found: error
          retention-days: 1
